[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcontroller-linux"
version = "2.5.0"
description = "Linux MCP stdio backend for AgentController"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[project.scripts]
agentcontroller-linux = "agentcontroller_linux.__main__:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
