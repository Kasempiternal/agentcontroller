name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    # macOS 15 runner: WindowRecorder uses SCRecordingOutput, which needs the
    # macOS 15 SDK (Xcode 16) to compile. The app still runs on macOS 14
    # (recording tools are @available-gated at runtime).
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      - name: Build (release, warnings as errors)
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

  windows-build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Build Windows server
        run: dotnet build Windows\Deskestro.Windows\Deskestro.Windows.csproj --configuration Release

      - name: Build Windows UI test fixture
        run: dotnet build Windows\Deskestro.Windows.TestApp\Deskestro.Windows.TestApp.csproj --configuration Release

      - name: MCP protocol smoke
        shell: pwsh
        run: .\Windows\smoke.ps1
