name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# A newer push to the same ref makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Platform-independent, so it runs on the cheapest runner and gives the
  # fastest signal: neither Swift nor .NET is needed to check the contract.
  contract-and-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The portability promise is the tool names. The two backends share no
      # code, so this is the only thing keeping their registries — and every
      # tool count and description quoted in the docs — honest.
      - name: Verify cross-platform tool contract
        run: ./Scripts/check-tool-contract.sh

      - name: Shell syntax
        run: |
          for f in build.sh Scripts/*.sh; do bash -n "$f"; done

      # Severity is capped at `warning` so a runner-image shellcheck bump can't
      # turn CI red on a new stylistic rule. Both scripts are clean at the
      # stricter `--severity=style` as of shellcheck 0.11.0.
      - name: Shellcheck
        run: shellcheck --severity=warning build.sh Scripts/*.sh

  # The iOS backend is TypeScript: it typechecks and builds anywhere, even
  # though the runtime needs a Mac with Xcode tooling. Ubuntu keeps it cheap.
  ios-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iOS
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: iOS/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  build-and-test:
    # macOS 15 runner: WindowRecorder uses SCRecordingOutput, which needs the
    # macOS 15 SDK (Xcode 16) to compile. The app still runs on macOS 14
    # (recording tools are @available-gated at runtime).
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Swift version
        run: swift --version

      - name: Build (release, warnings as errors)
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

  windows-build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Build Windows server
        run: dotnet build Windows\AgentController.Windows\AgentController.Windows.csproj --configuration Release

      - name: Build Windows UI test fixture
        run: dotnet build Windows\AgentController.Windows.TestApp\AgentController.Windows.TestApp.csproj --configuration Release

      # Protocol-level only. Windows/integration.ps1 drives real UI Automation
      # against the fixture and needs an interactive desktop, so it stays a
      # local pre-release step rather than a CI job.
      - name: MCP protocol smoke
        shell: pwsh
        run: .\Windows\smoke.ps1
